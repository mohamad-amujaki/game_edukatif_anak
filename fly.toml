# fly.toml — lihat README "Deploy API (Fly.io)"
#
# See https://fly.io/docs/reference/configuration/

app = 'game-edukatif-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'

# Jalankan migrasi sebelum traffic dialihkan — hindari timeout health check saat boot.
[deploy]
  release_command = 'pnpm exec prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '10s'
    grace_period = '60s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  cpu_kind = 'shared'
