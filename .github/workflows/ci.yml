name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
  DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
  # Playwright `pnpm dev` memakai VITE di 43121; samakan origin Better Auth.
  BETTER_AUTH_SECRET: ci-development-better-auth-secret-min-length-32
  BETTER_AUTH_URL: http://127.0.0.1:43121
  PIN_HASH_PEPPER: ci-pin-pepper-hash-32-character-minimum-x
  E2E_ADMIN_EMAIL: e2e-admin@ci.local
  E2E_ADMIN_PASSWORD: 'E2eAdminSecureTest1!'

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma migrate deploy

      - run: pnpm db:seed

      - run: pnpm admin:create -- --email "$E2E_ADMIN_EMAIL" --password "$E2E_ADMIN_PASSWORD"

      - run: pnpm check

      - run: pnpm run bank:validate

      - run: pnpm test

      - run: pnpm build

      - run: pnpm exec playwright install chromium --with-deps

      - run: pnpm test:e2e
        env:
          CI: true
